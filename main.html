<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

    <h1>Register System</h1>

    <form method="POST">

        <input type="text" name="username"
        placeholder="Username">
        <br><br>

        <input type="password" name="password"
        placeholder="Password">
        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <h2>{{ message }}</h2>

    <a href="/users">
        Show Users
    </a>

</body>
</html>
